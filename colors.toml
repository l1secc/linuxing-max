lighter_background        = "#24372d"
background_alt            = "#111814"
background_surface        = "#202f27"

foreground                = "#eceeed"
surface_foreground        = "#d3d9d6"
bright_foreground         = "#f7f8f7"
surface_bright_foreground = "#eaecea"
light_foreground          = "#b1beb7"
dark_foreground           = "#678876"
muted                     = "#476153"
surface_muted             = "#597365"

surface_red               = "#d17374"
surface_blue              = "#82aaff"
surface_green             = "#5fbf8f"

accent                    = "#3ddc84"
primary                   = "#22d3ee"
secondary                 = "#a3e635"

selection                 = "#2f5a43"
selection_background      = "#2f5a43"
selection_foreground      = "#ffffff"
cursor                    = "#3ddc84"

hyprland_active_border    = "rgba(3ddc84ee) rgba(22d3eeee) rgba(a3e635ee) 45deg"
hyprland_inactive_border  = "rgba(597365aa)"

# ---------------------------------------------------------------------------
