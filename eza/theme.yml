# ============================================================================
#  Linuxing Max · eza file-kind colours
#
#  Omarchy aliases `ls` to `eza`, and eza paints file and folder *names* from
#  its own theme — not from the terminal's default foreground. That is why the
#  terminal text can stay scheme-tinted white while folder names read the
#  terminal-native phosphor.
#
#  Colours are named ANSI slots, so they follow whichever palette the active
#  Omarchy theme puts in those slots instead of pinning hex values.
#
#  Installed to ~/.config/eza/theme.yml by tools/linuxing-bootstrap.
# ============================================================================

filekinds:
  # Folders in phosphor green (eza's own default is bold blue).
  directory:
    foreground: Green
    is_bold: true
  # Symlinks and mount points stay legible on black.
  symlink:
    foreground: Cyan
  # Executables read as "run me" — action red.
  executable:
    foreground: Red
    is_bold: true

file_type:
  # Images stay magenta by default; keep them legible.
  image:
    foreground: Magenta
