# ============================================================================
#  Linuxing Max — Security Blue · the SOC / neon-ops blue
#  generated by tools/linuxing_generate.py
#
#  · background is true black — the terminal canvas — and foreground is the
#    scheme-tinted near-white ink you type and read command output in
#  · accent / primary / secondary are the scheme identity and drive the
#    bar, menu, launcher, lock, selection and the 3-stop window border
#  · surface_* are the scheme-tinted desktop chrome (glass surfaces)
#  · the ANSI slots stay fixed and semantic, so errors never change colour
#    when you switch schemes
# ============================================================================

mode = "dark"

# ---------------------------------------------------------------------------
#  THEME · core surface + accent tokens
# ---------------------------------------------------------------------------

background                = "#000000"
surface_background        = "#131a20"
darker_background         = "#0a0e12"
dark_background           = "#1b232a"
lighter_background        = "#212f3a"
background_alt            = "#101519"
background_surface        = "#1d2932"

foreground                = "#ecedef"
surface_foreground        = "#d2d7da"
bright_foreground         = "#f7f7f8"
surface_bright_foreground = "#e9ebec"
light_foreground          = "#afb8c0"
dark_foreground           = "#627a8e"
muted                     = "#435665"
surface_muted             = "#546878"

surface_red               = "#d17374"
surface_blue              = "#82aaff"
surface_green             = "#5fbf8f"

accent                    = "#4dabf7"
primary                   = "#22d3ee"
secondary                 = "#a78bfa"

selection                 = "#294861"
selection_background      = "#294861"
selection_foreground      = "#ffffff"
cursor                    = "#4dabf7"

hyprland_active_border    = "rgba(4dabf7ee) rgba(22d3eeee) rgba(a78bfaee) 45deg"
hyprland_inactive_border  = "rgba(546878aa)"

# ---------------------------------------------------------------------------
#  COLORS · semantic palette (syntax-highlight friendly, fixed across schemes)
# ---------------------------------------------------------------------------

red              = "#ff5c7a"
yellow           = "#e5c07b"
orange           = "#f6a86b"
green            = "#3ddc84"
cyan             = "#56b6c2"
