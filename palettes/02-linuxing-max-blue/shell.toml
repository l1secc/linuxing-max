# ============================================================================
#  Linuxing Max — Security Blue · the SOC / neon-ops blue
#  generated by tools/linuxing_generate.py
#  surface #131a20 · accent #4dabf7 · primary #22d3ee · secondary #a78bfa
#
#  The scheme-tinted glass surfaces for the Omarchy shell: bar, menu,
#  launcher, lock, notifications, tooltips, popups, polkit and the image
#  picker. Slightly more translucent than stock — the "reduced opacity" half
#  of the Linuxing look.
# ============================================================================

[bar]
background       = "#131a20"
background-alpha = 0.84
text             = "#d2d7da"
active           = "#4dabf7"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(4dabf7ee) rgba(22d3eeee) rgba(a78bfaee) 45deg"
active-border-foreground = "#4dabf7"

[controls]
normal-color        = "#afb8c0"
normal-fill-alpha   = 0.05
normal-border       = "#afb8c0"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#e9ebec"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#4dabf7"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#4dabf7"
focus-fill-alpha   = 0.12
focus-border       = "#4dabf7"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#22d3ee"
selected-fill-alpha   = 0.18
selected-border       = "#22d3ee"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#1b232a"
background-alpha = 0.90
text             = "#d2d7da"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#1b232a"
background-alpha = 0.90
text             = "#e9ebec"
border           = "#4dabf7"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#1b232a"
background-alpha = 0.90
text             = "#d2d7da"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#4dabf7"

[launcher]
background                = "#131a20"
background-alpha          = 0.92
text                      = "#e9ebec"
border                    = "#4dabf7"
border-alpha              = 1.0
scrim                     = "#131a20"
scrim-alpha               = 0.55
selected-background       = "#294861"
selected-background-alpha = 0.30
selected-text             = "#c6b6f6"
selected-border           = "#4dabf7"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#131a20"
background-alpha          = 0.92
text                      = "#e9ebec"
border                    = "#4dabf7"
border-alpha              = 1.0
scrim                     = "#131a20"
scrim-alpha               = 0.55
selected-background       = "#294861"
selected-background-alpha = 0.30
selected-text             = "#c6b6f6"
selected-border           = "#4dabf7"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#131a20"
background-alpha = 0.92
text             = "#d2d7da"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
scrim            = "#131a20"
scrim-alpha      = 0.5
accent           = "#4dabf7"

[lock]
background       = "#131a20"
background-alpha = 0.78
text             = "#d2d7da"
placeholder      = "#627a8e"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
selection        = "#4dabf7"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#131a20"
scrim-alpha             = "0.5"
text                    = "#d2d7da"
selected-border         = "#4dabf7"
selected-border-alpha   = 1.0
unselected-border       = "#afb8c0"
unselected-border-alpha = 0.28
