# ============================================================================
#  Linuxing Max — Sunset Amber · golden hour over the mainframe
#  generated by tools/linuxing_generate.py
#  surface #201713 · accent #f6743f · primary #c24771 · secondary #9947c2
#
#  The scheme-tinted glass surfaces for the Omarchy shell: bar, menu,
#  launcher, lock, notifications, tooltips, popups, polkit and the image
#  picker. Slightly more translucent than stock — the "reduced opacity" half
#  of the Linuxing look.
# ============================================================================

[bar]
background       = "#201713"
background-alpha = 0.84
text             = "#dad5d2"
active           = "#f6743f"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(f6743fee) rgba(c24771ee) rgba(9947c2ee) 45deg"
active-border-foreground = "#f6743f"

[controls]
normal-color        = "#c0b4af"
normal-fill-alpha   = 0.05
normal-border       = "#c0b4af"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#eceae9"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#f6743f"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#f6743f"
focus-fill-alpha   = 0.12
focus-border       = "#f6743f"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#c24771"
selected-fill-alpha   = 0.18
selected-border       = "#c24771"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#2a1f1b"
background-alpha = 0.90
text             = "#dad5d2"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#2a1f1b"
background-alpha = 0.90
text             = "#eceae9"
border           = "#f6743f"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#2a1f1b"
background-alpha = 0.90
text             = "#dad5d2"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#f6743f"

[launcher]
background                = "#201713"
background-alpha          = 0.92
text                      = "#eceae9"
border                    = "#f6743f"
border-alpha              = 1.0
scrim                     = "#201713"
scrim-alpha               = 0.55
selected-background       = "#613929"
selected-background-alpha = 0.30
selected-text             = "#dcc5e8"
selected-border           = "#f6743f"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#201713"
background-alpha          = 0.92
text                      = "#eceae9"
border                    = "#f6743f"
border-alpha              = 1.0
scrim                     = "#201713"
scrim-alpha               = 0.55
selected-background       = "#613929"
selected-background-alpha = 0.30
selected-text             = "#dcc5e8"
selected-border           = "#f6743f"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#201713"
background-alpha = 0.92
text             = "#dad5d2"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
scrim            = "#201713"
scrim-alpha      = 0.5
accent           = "#f6743f"

[lock]
background       = "#201713"
background-alpha = 0.78
text             = "#dad5d2"
placeholder      = "#8e6f62"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
selection        = "#f6743f"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#201713"
scrim-alpha             = "0.5"
text                    = "#dad5d2"
selected-border         = "#f6743f"
selected-border-alpha   = 1.0
unselected-border       = "#c0b4af"
unselected-border-alpha = 0.28
