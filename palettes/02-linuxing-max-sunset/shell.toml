# ============================================================================
#  Linuxing Max — Sunset Amber · golden hour over the mainframe
#  generated by tools/linuxing_generate.py
#  surface #201a13 · accent #ea9e42 · primary #c84153 · secondary #c247aa
#
#  The scheme-tinted glass surfaces for the Omarchy shell: bar, menu,
#  launcher, lock, notifications, tooltips, popups, polkit and the image
#  picker. Slightly more translucent than stock — the "reduced opacity" half
#  of the Linuxing look.
# ============================================================================

[bar]
background       = "#201a13"
background-alpha = 0.84
text             = "#d9d7d3"
active           = "#ea9e42"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(ea9e42ee) rgba(c84153ee) rgba(c247aaee) 45deg"
active-border-foreground = "#ea9e42"

[controls]
normal-color        = "#bfb8b0"
normal-fill-alpha   = 0.05
normal-border       = "#bfb8b0"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#ecebe9"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#ea9e42"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#ea9e42"
focus-fill-alpha   = 0.12
focus-border       = "#ea9e42"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#c84153"
selected-fill-alpha   = 0.18
selected-border       = "#c84153"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#29231c"
background-alpha = 0.90
text             = "#d9d7d3"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#29231c"
background-alpha = 0.90
text             = "#ecebe9"
border           = "#ea9e42"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#29231c"
background-alpha = 0.90
text             = "#d9d7d3"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#ea9e42"

[launcher]
background                = "#201a13"
background-alpha          = 0.92
text                      = "#ecebe9"
border                    = "#ea9e42"
border-alpha              = 1.0
scrim                     = "#201a13"
scrim-alpha               = 0.55
selected-background       = "#5e472c"
selected-background-alpha = 0.30
selected-text             = "#e8c5e1"
selected-border           = "#ea9e42"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#201a13"
background-alpha          = 0.92
text                      = "#ecebe9"
border                    = "#ea9e42"
border-alpha              = 1.0
scrim                     = "#201a13"
scrim-alpha               = 0.55
selected-background       = "#5e472c"
selected-background-alpha = 0.30
selected-text             = "#e8c5e1"
selected-border           = "#ea9e42"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#201a13"
background-alpha = 0.92
text             = "#d9d7d3"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
scrim            = "#201a13"
scrim-alpha      = 0.5
accent           = "#ea9e42"

[lock]
background       = "#201a13"
background-alpha = 0.78
text             = "#d9d7d3"
placeholder      = "#8b7a65"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
selection        = "#ea9e42"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#201a13"
scrim-alpha             = "0.5"
text                    = "#d9d7d3"
selected-border         = "#ea9e42"
selected-border-alpha   = 1.0
unselected-border       = "#bfb8b0"
unselected-border-alpha = 0.28
