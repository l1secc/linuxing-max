bright_foreground         = "#f8f7f8"
surface_bright_foreground = "#ece9ec"
light_foreground          = "#bfb0bf"
dark_foreground           = "#8b658a"
muted                     = "#634562"
surface_muted             = "#755775"

surface_red               = "#d17374"
surface_blue              = "#82aaff"
surface_green             = "#5fbf8f"

accent                    = "#e831e4"
primary                   = "#6343c7"
secondary                 = "#965cd6"

selection                 = "#5e2c5d"
selection_background      = "#5e2c5d"
selection_foreground      = "#ffffff"
cursor                    = "#e831e4"

hyprland_active_border    = "rgba(e831e4ee) rgba(6343c7ee) rgba(965cd6ee) 45deg"
hyprland_inactive_border  = "rgba(755775aa)"

# ---------------------------------------------------------------------------
