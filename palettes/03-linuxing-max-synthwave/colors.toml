bright_foreground         = "#f8f7f7"
surface_bright_foreground = "#eceaeb"
light_foreground          = "#beb1b9"
dark_foreground           = "#89677b"
muted                     = "#614756"
surface_muted             = "#745868"

surface_red               = "#d17374"
surface_blue              = "#82aaff"
surface_green             = "#5fbf8f"

accent                    = "#dc2d94"
primary                   = "#8a23e7"
secondary                 = "#d65cd3"

selection                 = "#5b2f49"
selection_background      = "#5b2f49"
selection_foreground      = "#ffffff"
cursor                    = "#dc2d94"

hyprland_active_border    = "rgba(dc2d94ee) rgba(8a23e7ee) rgba(d65cd3ee) 45deg"
hyprland_inactive_border  = "rgba(745868aa)"

