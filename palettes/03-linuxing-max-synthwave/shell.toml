# ============================================================================
#  Linuxing Max — Neon Synthwave · hot-pink wires under a striped sun
#  generated by tools/linuxing_generate.py
#  surface #1f141a · accent #dc2d94 · primary #8a23e7 · secondary #d65cd3
#
#  The scheme-tinted glass surfaces for the Omarchy shell: bar, menu,
#  launcher, lock, notifications, tooltips, popups, polkit and the image
#  picker. Slightly more translucent than stock — the "reduced opacity" half
#  of the Linuxing look.
# ============================================================================

[bar]
background       = "#1f141a"
background-alpha = 0.84
text             = "#d9d3d7"
active           = "#dc2d94"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(dc2d94ee) rgba(8a23e7ee) rgba(d65cd3ee) 45deg"
active-border-foreground = "#dc2d94"

[controls]
normal-color        = "#beb1b9"
normal-fill-alpha   = 0.05
normal-border       = "#beb1b9"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#eceaeb"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#dc2d94"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#dc2d94"
focus-fill-alpha   = 0.12
focus-border       = "#dc2d94"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#8a23e7"
selected-fill-alpha   = 0.18
selected-border       = "#8a23e7"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#291c24"
background-alpha = 0.90
text             = "#d9d3d7"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#291c24"
background-alpha = 0.90
text             = "#eceaeb"
border           = "#dc2d94"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#291c24"
background-alpha = 0.90
text             = "#d9d3d7"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#dc2d94"

[launcher]
background                = "#1f141a"
background-alpha          = 0.92
text                      = "#eceaeb"
border                    = "#dc2d94"
border-alpha              = 1.0
scrim                     = "#1f141a"
scrim-alpha               = 0.55
selected-background       = "#5b2f49"
selected-background-alpha = 0.30
selected-text             = "#ebc1ea"
selected-border           = "#dc2d94"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#1f141a"
background-alpha          = 0.92
text                      = "#eceaeb"
border                    = "#dc2d94"
border-alpha              = 1.0
scrim                     = "#1f141a"
scrim-alpha               = 0.55
selected-background       = "#5b2f49"
selected-background-alpha = 0.30
selected-text             = "#ebc1ea"
selected-border           = "#dc2d94"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#1f141a"
background-alpha = 0.92
text             = "#d9d3d7"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
scrim            = "#1f141a"
scrim-alpha      = 0.5
accent           = "#dc2d94"

[lock]
background       = "#1f141a"
background-alpha = 0.78
text             = "#d9d3d7"
placeholder      = "#89677b"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
selection        = "#dc2d94"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#1f141a"
scrim-alpha             = "0.5"
text                    = "#d9d3d7"
selected-border         = "#dc2d94"
selected-border-alpha   = 1.0
unselected-border       = "#beb1b9"
unselected-border-alpha = 0.28
