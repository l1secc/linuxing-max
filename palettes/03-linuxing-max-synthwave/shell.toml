# ============================================================================
#  Linuxing Max — Neon Synthwave · hot-pink wires under a striped sun
#  generated by tools/linuxing_generate.py
#  surface #20131f · accent #e831e4 · primary #6343c7 · secondary #965cd6
#
#  The scheme-tinted glass surfaces for the Omarchy shell: bar, menu,
#  launcher, lock, notifications, tooltips, popups, polkit and the image
#  picker. Slightly more translucent than stock — the "reduced opacity" half
#  of the Linuxing look.
# ============================================================================

[bar]
background       = "#20131f"
background-alpha = 0.84
text             = "#d9d3d9"
active           = "#e831e4"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(e831e4ee) rgba(6343c7ee) rgba(965cd6ee) 45deg"
active-border-foreground = "#e831e4"

[controls]
normal-color        = "#bfb0bf"
normal-fill-alpha   = 0.05
normal-border       = "#bfb0bf"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#ece9ec"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#e831e4"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#e831e4"
focus-fill-alpha   = 0.12
focus-border       = "#e831e4"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#6343c7"
selected-fill-alpha   = 0.18
selected-border       = "#6343c7"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#291c29"
background-alpha = 0.90
text             = "#d9d3d9"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#291c29"
background-alpha = 0.90
text             = "#ece9ec"
border           = "#e831e4"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#291c29"
background-alpha = 0.90
text             = "#d9d3d9"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#e831e4"

[launcher]
background                = "#20131f"
background-alpha          = 0.92
text                      = "#ece9ec"
border                    = "#e831e4"
border-alpha              = 1.0
scrim                     = "#20131f"
scrim-alpha               = 0.55
selected-background       = "#5e2c5d"
selected-background-alpha = 0.30
selected-text             = "#d5c1eb"
selected-border           = "#e831e4"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#20131f"
background-alpha          = 0.92
text                      = "#ece9ec"
border                    = "#e831e4"
border-alpha              = 1.0
scrim                     = "#20131f"
scrim-alpha               = 0.55
selected-background       = "#5e2c5d"
selected-background-alpha = 0.30
selected-text             = "#d5c1eb"
selected-border           = "#e831e4"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#20131f"
background-alpha = 0.92
text             = "#d9d3d9"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
scrim            = "#20131f"
scrim-alpha      = 0.5
accent           = "#e831e4"

[lock]
background       = "#20131f"
background-alpha = 0.78
text             = "#d9d3d9"
placeholder      = "#8b658a"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
selection        = "#e831e4"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#20131f"
scrim-alpha             = "0.5"
text                    = "#d9d3d9"
selected-border         = "#e831e4"
selected-border-alpha   = 1.0
unselected-border       = "#bfb0bf"
unselected-border-alpha = 0.28
