# ============================================================================
#  Linuxing Max — Mono White · the clean monochrome lab
#  generated by tools/linuxing_generate.py
#
#  · background is true black — the terminal canvas — and foreground is the
#    scheme-tinted near-white ink you type and read command output in
#  · accent / primary / secondary are the scheme identity and drive the
#    bar, menu, launcher, lock, selection and the 3-stop window border
#  · surface_* are the scheme-tinted desktop chrome (glass surfaces)
#  · the ANSI slots stay fixed and semantic, so errors never change colour
#    when you switch schemes
# ============================================================================

mode = "dark"

# ---------------------------------------------------------------------------
#  THEME · core surface + accent tokens
# ---------------------------------------------------------------------------

background                = "#000000"
surface_background        = "#1a1a1a"
darker_background         = "#0e0e0e"
dark_background           = "#222222"
lighter_background        = "#2e2e2e"
background_alt            = "#141414"
background_surface        = "#282828"

foreground                = "#ededed"
surface_foreground        = "#d6d6d6"
bright_foreground         = "#f7f7f7"
surface_bright_foreground = "#ebebeb"
light_foreground          = "#b8b8b8"
dark_foreground           = "#787878"
muted                     = "#545454"
surface_muted             = "#666666"

surface_red               = "#d17374"
surface_blue              = "#82aaff"
surface_green             = "#5fbf8f"

accent                    = "#e8e8e8"
primary                   = "#9aa0a6"
secondary                 = "#c9ccd1"

selection                 = "#454545"
selection_background      = "#454545"
selection_foreground      = "#ffffff"
cursor                    = "#e8e8e8"

hyprland_active_border    = "rgba(e8e8e8ee) rgba(9aa0a6ee) rgba(c9ccd1ee) 45deg"
hyprland_inactive_border  = "rgba(666666aa)"

# ---------------------------------------------------------------------------
#  COLORS · semantic palette (syntax-highlight friendly, fixed across schemes)
# ---------------------------------------------------------------------------

red              = "#ff5c7a"
yellow           = "#e5c07b"
orange           = "#f6a86b"
green            = "#3ddc84"
cyan             = "#56b6c2"
blue             = "#61afef"
magenta          = "#c678dd"
brown            = "#b08d6a"
bright_red       = "#ff7a93"
bright_yellow    = "#f0d9a0"
bright_green     = "#7ce8a8"
bright_cyan      = "#7fd8e0"
bright_blue      = "#82c8ff"
bright_magenta   = "#e0a8ee"

# ---------------------------------------------------------------------------
#  ANSI 0-15 · terminal color matrix
# ---------------------------------------------------------------------------

color0   = "#000000"
color1   = "#ff5c7a"
color2   = "#3ddc84"
color3   = "#e5c07b"
color4   = "#61afef"
color5   = "#c678dd"
color6   = "#56b6c2"
color7   = "#d8dee9"
color8   = "#6b7280"
