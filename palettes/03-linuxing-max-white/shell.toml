# ============================================================================
#  Linuxing Max — Mono White · the clean monochrome lab
#  generated by tools/linuxing_generate.py
#  surface #1a1a1a · accent #e8e8e8 · primary #9aa0a6 · secondary #c9ccd1
#
#  The scheme-tinted glass surfaces for the Omarchy shell: bar, menu,
#  launcher, lock, notifications, tooltips, popups, polkit and the image
#  picker. Slightly more translucent than stock — the "reduced opacity" half
#  of the Linuxing look.
# ============================================================================

[bar]
background       = "#1a1a1a"
background-alpha = 0.84
text             = "#d6d6d6"
active           = "#e8e8e8"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(e8e8e8ee) rgba(9aa0a6ee) rgba(c9ccd1ee) 45deg"
active-border-foreground = "#e8e8e8"

[controls]
normal-color        = "#b8b8b8"
normal-fill-alpha   = 0.05
normal-border       = "#b8b8b8"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#ebebeb"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#e8e8e8"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#e8e8e8"
focus-fill-alpha   = 0.12
focus-border       = "#e8e8e8"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#9aa0a6"
selected-fill-alpha   = 0.18
selected-border       = "#9aa0a6"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#222222"
background-alpha = 0.90
text             = "#d6d6d6"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#222222"
background-alpha = 0.90
text             = "#ebebeb"
border           = "#e8e8e8"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#222222"
background-alpha = 0.90
text             = "#d6d6d6"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#e8e8e8"

[launcher]
background                = "#1a1a1a"
background-alpha          = 0.92
text                      = "#ebebeb"
border                    = "#e8e8e8"
border-alpha              = 1.0
scrim                     = "#1a1a1a"
scrim-alpha               = 0.55
selected-background       = "#454545"
selected-background-alpha = 0.30
selected-text             = "#d3d6d9"
selected-border           = "#e8e8e8"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#1a1a1a"
background-alpha          = 0.92
text                      = "#ebebeb"
border                    = "#e8e8e8"
border-alpha              = 1.0
scrim                     = "#1a1a1a"
scrim-alpha               = 0.55
selected-background       = "#454545"
selected-background-alpha = 0.30
selected-text             = "#d3d6d9"
selected-border           = "#e8e8e8"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#1a1a1a"
background-alpha = 0.92
text             = "#d6d6d6"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
scrim            = "#1a1a1a"
scrim-alpha      = 0.5
accent           = "#e8e8e8"

[lock]
background       = "#1a1a1a"
background-alpha = 0.78
text             = "#d6d6d6"
placeholder      = "#787878"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
selection        = "#e8e8e8"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#1a1a1a"
scrim-alpha             = "0.5"
text                    = "#d6d6d6"
selected-border         = "#e8e8e8"
selected-border-alpha   = 1.0
unselected-border       = "#b8b8b8"
unselected-border-alpha = 0.28
