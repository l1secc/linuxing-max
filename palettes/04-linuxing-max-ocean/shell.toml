# ============================================================================
#  Linuxing Max — Deep Ocean · a sonar sweep in the abyss
#  generated by tools/linuxing_generate.py
#  surface #151e1d · accent #38d1c4 · primary #5cb8d6 · secondary #5cd69c
#
#  The scheme-tinted glass surfaces for the Omarchy shell: bar, menu,
#  launcher, lock, notifications, tooltips, popups, polkit and the image
#  picker. Slightly more translucent than stock — the "reduced opacity" half
#  of the Linuxing look.
# ============================================================================

[bar]
background       = "#151e1d"
background-alpha = 0.84
text             = "#d4d9d8"
active           = "#38d1c4"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(38d1c4ee) rgba(5cb8d6ee) rgba(5cd69cee) 45deg"
active-border-foreground = "#38d1c4"

[controls]
normal-color        = "#b2bdbc"
normal-fill-alpha   = 0.05
normal-border       = "#b2bdbc"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#eaebeb"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#38d1c4"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#38d1c4"
focus-fill-alpha   = 0.12
focus-border       = "#38d1c4"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#5cb8d6"
selected-fill-alpha   = 0.18
selected-border       = "#5cb8d6"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#1d2827"
background-alpha = 0.90
text             = "#d4d9d8"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#1d2827"
background-alpha = 0.90
text             = "#eaebeb"
border           = "#38d1c4"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#1d2827"
background-alpha = 0.90
text             = "#d4d9d8"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#38d1c4"

[launcher]
background                = "#151e1d"
background-alpha          = 0.92
text                      = "#eaebeb"
border                    = "#38d1c4"
border-alpha              = 1.0
scrim                     = "#151e1d"
scrim-alpha               = 0.55
selected-background       = "#325855"
selected-background-alpha = 0.30
selected-text             = "#c1ebd7"
selected-border           = "#38d1c4"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#151e1d"
background-alpha          = 0.92
text                      = "#eaebeb"
border                    = "#38d1c4"
border-alpha              = 1.0
scrim                     = "#151e1d"
scrim-alpha               = 0.55
selected-background       = "#325855"
selected-background-alpha = 0.30
selected-text             = "#c1ebd7"
selected-border           = "#38d1c4"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#151e1d"
background-alpha = 0.92
text             = "#d4d9d8"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
scrim            = "#151e1d"
scrim-alpha      = 0.5
accent           = "#38d1c4"

[lock]
background       = "#151e1d"
background-alpha = 0.78
text             = "#d4d9d8"
placeholder      = "#698784"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
selection        = "#38d1c4"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#151e1d"
scrim-alpha             = "0.5"
text                    = "#d4d9d8"
selected-border         = "#38d1c4"
selected-border-alpha   = 1.0
unselected-border       = "#b2bdbc"
unselected-border-alpha = 0.28
