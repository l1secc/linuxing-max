# ============================================================================
#  Linuxing Max — Deep Ocean · a sonar sweep in the abyss
#  generated by tools/linuxing_generate.py
#  surface #141e1f · accent #41d1da · primary #5c98d6 · secondary #5cd69b
#
#  The scheme-tinted glass surfaces for the Omarchy shell: bar, menu,
#  launcher, lock, notifications, tooltips, popups, polkit and the image
#  picker. Slightly more translucent than stock — the "reduced opacity" half
#  of the Linuxing look.
# ============================================================================

[bar]
background       = "#141e1f"
background-alpha = 0.84
text             = "#d3d9d9"
active           = "#41d1da"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(41d1daee) rgba(5c98d6ee) rgba(5cd69bee) 45deg"
active-border-foreground = "#41d1da"

[controls]
normal-color        = "#b1bdbe"
normal-fill-alpha   = 0.05
normal-border       = "#b1bdbe"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#eaebec"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#41d1da"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#41d1da"
focus-fill-alpha   = 0.12
focus-border       = "#41d1da"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#5c98d6"
selected-fill-alpha   = 0.18
selected-border       = "#5c98d6"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#1d2828"
background-alpha = 0.90
text             = "#d3d9d9"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#1d2828"
background-alpha = 0.90
text             = "#eaebec"
border           = "#41d1da"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#1d2828"
background-alpha = 0.90
text             = "#d3d9d9"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#41d1da"

[launcher]
background                = "#141e1f"
background-alpha          = 0.92
text                      = "#eaebec"
border                    = "#41d1da"
border-alpha              = 1.0
scrim                     = "#141e1f"
scrim-alpha               = 0.55
selected-background       = "#30575a"
selected-background-alpha = 0.30
selected-text             = "#c1ebd7"
selected-border           = "#41d1da"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#141e1f"
background-alpha          = 0.92
text                      = "#eaebec"
border                    = "#41d1da"
border-alpha              = 1.0
scrim                     = "#141e1f"
scrim-alpha               = 0.55
selected-background       = "#30575a"
selected-background-alpha = 0.30
selected-text             = "#c1ebd7"
selected-border           = "#41d1da"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#141e1f"
background-alpha = 0.92
text             = "#d3d9d9"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
scrim            = "#141e1f"
scrim-alpha      = 0.5
accent           = "#41d1da"

[lock]
background       = "#141e1f"
background-alpha = 0.78
text             = "#d3d9d9"
placeholder      = "#688688"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
selection        = "#41d1da"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#141e1f"
scrim-alpha             = "0.5"
text                    = "#d3d9d9"
selected-border         = "#41d1da"
selected-border-alpha   = 1.0
unselected-border       = "#b1bdbe"
unselected-border-alpha = 0.28
