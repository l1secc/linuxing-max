# ============================================================================
#  Linuxing Max — Root Red · the exploit / root prompt
#  generated by tools/linuxing_generate.py
#
#  · background is true black — the terminal canvas — and foreground is the
#    scheme-tinted near-white ink you type and read command output in
#  · accent / primary / secondary are the scheme identity and drive the
#    bar, menu, launcher, lock, selection and the 3-stop window border
#  · surface_* are the scheme-tinted desktop chrome (glass surfaces)
#  · the ANSI slots stay fixed and semantic, so errors never change colour
#    when you switch schemes
# ============================================================================

mode = "dark"

# ---------------------------------------------------------------------------
