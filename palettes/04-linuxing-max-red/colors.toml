light_foreground          = "#c1aeae"
dark_foreground           = "#906060"
muted                     = "#674242"
surface_muted             = "#795353"

surface_red               = "#d17374"
surface_blue              = "#82aaff"
surface_green             = "#5fbf8f"

accent                    = "#ff6b6b"
