# ============================================================================
#  Linuxing Max — Crimson Root · red-hot root access
#  generated by tools/linuxing_generate.py
#  surface #211214 · accent #f73344 · primary #d6885c · secondary #d65ca9
#
#  Legacy/non-Omarchy Hyprland parity config: the 3-stop gradient, the soft
#  squircle look and the full "Linuxing glides" animation set. Omarchy itself
#  reads hypr/looknfeel.lua (installed by the bootstrap); this file is kept so
#  a vanilla Hyprland setup looks and moves identically.
# ============================================================================

$activeBorderColor   = rgba(f73344ee) rgba(d6885cee) rgba(d65ca9ee) 45deg
$inactiveBorderColor = rgba(785457aa)
$groupbarActive      = rgba(247,51,68, 255)

general {
    col.active_border   = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    gaps_in             = 6
    gaps_out            = 14
    border_size         = 2
}

group {
    col.border_active   = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
    groupbar {
        col.active   = $groupbarActive
        col.inactive = rgba(785457aa)
        text_color   = #120a0b
    }
}

decoration {
    rounding       = 16
    rounding_power = 3

    # Soft, diffused window shadow — depth without harsh edges
    shadow {
        enabled        = yes
        render_power   = 3
        range          = 28
        color          = rgba(000000a6)
        color_inactive = rgba(00000073)
        offset         = 0, 2
    }

    # Glassmorphism — what shows through a translucent surface is blurred
    blur {
        enabled          = true
        size             = 7
        passes           = 2
        noise            = 0.0117
        contrast         = 1.0
        brightness       = 1.0
        new_optimizations = on
    }
}

# Rich, expressive window animations — "Linuxing glides through the terminal"
animations {
    enabled = true

    # Bezier curves — calm and expressive, never jarring
    bezier = expressiveFastSpatial, 0.42, 1.67, 0.21, 0.90
    bezier = emphasizedDecel,      0.05, 0.7, 0.1, 1
    bezier = menu_decel,           0.1, 1, 0, 1
    bezier = emphasizedAccel,      0.3, 0, 0.8, 0.15
    bezier = menu_accel,           0.3, 0, 0.8, 0.15
    bezier = spring,               0.34, 1.56, 0.64, 1
    bezier = glide,                0.25, 0.46, 0.45, 0.94

    animation = windowsIn,     1, 3.2, spring,          popin 80%
    animation = windowsOut,    1, 2,   emphasizedDecel, popin 90%
    animation = windowsMove,   1, 3,   glide,           slide
    animation = border,        1, 10,  emphasizedDecel
    animation = fade,          1, 4,   menu_decel
    animation = fadeIn,        1, 3,   menu_decel
    animation = fadeOut,       1, 2.7, menu_accel
    animation = fadeLayersIn,  1, 3,   menu_decel
    animation = fadeLayersOut, 1, 2.7, menu_accel
    animation = workspaces,    1, 7,   menu_decel,      slide
    animation = layersIn,      1, 2.7, emphasizedDecel, popin 93%
    animation = layersOut,     1, 2.4, menu_accel,      popin 94%
}

# Translucent windows — one notch below stock; text stays crisp, blur turns it
# into glass. Windows that opted out (video, PiP, games) are left alone.
windowrulev2 = match:class .*, opacity 0.92 override 0.85 override, no_dim on
