# ============================================================================
#  Linuxing Max — Crimson Root · red-hot root access
#  generated by tools/linuxing_generate.py
#  surface #201314 · accent #ed3541 · primary #d67c5c · secondary #d65c94
#
#  The scheme-tinted glass surfaces for the Omarchy shell: bar, menu,
#  launcher, lock, notifications, tooltips, popups, polkit and the image
#  picker. Slightly more translucent than stock — the "reduced opacity" half
#  of the Linuxing look.
# ============================================================================

[bar]
background       = "#201314"
background-alpha = 0.84
text             = "#dad3d3"
active           = "#ed3541"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(ed3541ee) rgba(d67c5cee) rgba(d65c94ee) 45deg"
active-border-foreground = "#ed3541"

[controls]
normal-color        = "#bfb0b1"
normal-fill-alpha   = 0.05
normal-border       = "#bfb0b1"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#ece9ea"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#ed3541"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#ed3541"
focus-fill-alpha   = 0.12
focus-border       = "#ed3541"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#d67c5c"
selected-fill-alpha   = 0.18
selected-border       = "#d67c5c"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#2a1b1c"
background-alpha = 0.90
text             = "#dad3d3"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#2a1b1c"
background-alpha = 0.90
text             = "#ece9ea"
border           = "#ed3541"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#2a1b1c"
background-alpha = 0.90
text             = "#dad3d3"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#ed3541"

[launcher]
background                = "#201314"
background-alpha          = 0.92
text                      = "#ece9ea"
border                    = "#ed3541"
border-alpha              = 1.0
scrim                     = "#201314"
scrim-alpha               = 0.55
selected-background       = "#5f2b2e"
selected-background-alpha = 0.30
selected-text             = "#ebc1d4"
selected-border           = "#ed3541"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#201314"
background-alpha          = 0.92
text                      = "#ece9ea"
border                    = "#ed3541"
border-alpha              = 1.0
scrim                     = "#201314"
scrim-alpha               = 0.55
selected-background       = "#5f2b2e"
selected-background-alpha = 0.30
selected-text             = "#ebc1d4"
selected-border           = "#ed3541"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#201314"
background-alpha = 0.92
text             = "#dad3d3"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
scrim            = "#201314"
scrim-alpha      = 0.5
accent           = "#ed3541"

[lock]
background       = "#201314"
background-alpha = 0.78
text             = "#dad3d3"
