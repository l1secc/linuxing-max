# ============================================================================
#  Linuxing Max — Frostbite · cold storage at the north pole
#  generated by tools/linuxing_generate.py
#  surface #141a1f · accent #7cb9e9 · primary #5c69d6 · secondary #5cd6ca
#
#  The scheme-tinted glass surfaces for the Omarchy shell: bar, menu,
#  launcher, lock, notifications, tooltips, popups, polkit and the image
#  picker. Slightly more translucent than stock — the "reduced opacity" half
#  of the Linuxing look.
# ============================================================================

[bar]
background       = "#141a1f"
background-alpha = 0.84
text             = "#d3d7d9"
active           = "#7cb9e9"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(7cb9e9ee) rgba(5c69d6ee) rgba(5cd6caee) 45deg"
active-border-foreground = "#7cb9e9"

[controls]
normal-color        = "#b1b8be"
normal-fill-alpha   = 0.05
normal-border       = "#b1b8be"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#eaebec"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#7cb9e9"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#7cb9e9"
focus-fill-alpha   = 0.12
focus-border       = "#7cb9e9"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#5c69d6"
selected-fill-alpha   = 0.18
selected-border       = "#5c69d6"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#1c2329"
background-alpha = 0.90
text             = "#d3d7d9"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#1c2329"
background-alpha = 0.90
text             = "#eaebec"
border           = "#7cb9e9"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#1c2329"
background-alpha = 0.90
text             = "#d3d7d9"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#7cb9e9"

[launcher]
background                = "#141a1f"
background-alpha          = 0.92
text                      = "#eaebec"
border                    = "#7cb9e9"
border-alpha              = 1.0
scrim                     = "#141a1f"
scrim-alpha               = 0.55
selected-background       = "#2f475b"
selected-background-alpha = 0.30
selected-text             = "#c1ebe7"
selected-border           = "#7cb9e9"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#141a1f"
background-alpha          = 0.92
text                      = "#eaebec"
border                    = "#7cb9e9"
border-alpha              = 1.0
scrim                     = "#141a1f"
scrim-alpha               = 0.55
selected-background       = "#2f475b"
selected-background-alpha = 0.30
selected-text             = "#c1ebe7"
selected-border           = "#7cb9e9"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#141a1f"
background-alpha = 0.92
text             = "#d3d7d9"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
scrim            = "#141a1f"
scrim-alpha      = 0.5
accent           = "#7cb9e9"

[lock]
background       = "#141a1f"
background-alpha = 0.78
text             = "#d3d7d9"
placeholder      = "#677a89"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
selection        = "#7cb9e9"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#141a1f"
scrim-alpha             = "0.5"
text                    = "#d3d7d9"
selected-border         = "#7cb9e9"
selected-border-alpha   = 1.0
unselected-border       = "#b1b8be"
unselected-border-alpha = 0.28
