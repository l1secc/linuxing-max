# ============================================================================
#  Linuxing Max — Frostbite · cold storage at the north pole
#  generated by tools/linuxing_generate.py
#  surface #151a1e · accent #7bb7e0 · primary #5c7cd6 · secondary #5cd4d6
#
#  The scheme-tinted glass surfaces for the Omarchy shell: bar, menu,
#  launcher, lock, notifications, tooltips, popups, polkit and the image
#  picker. Slightly more translucent than stock — the "reduced opacity" half
#  of the Linuxing look.
# ============================================================================

[bar]
background       = "#151a1e"
background-alpha = 0.84
text             = "#d4d7d9"
active           = "#7bb7e0"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(7bb7e0ee) rgba(5c7cd6ee) rgba(5cd4d6ee) 45deg"
active-border-foreground = "#7bb7e0"

[controls]
normal-color        = "#b2b9bd"
normal-fill-alpha   = 0.05
normal-border       = "#b2b9bd"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#eaebeb"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#7bb7e0"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#7bb7e0"
focus-fill-alpha   = 0.12
focus-border       = "#7bb7e0"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#5c7cd6"
selected-fill-alpha   = 0.18
selected-border       = "#5c7cd6"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#1d2328"
background-alpha = 0.90
text             = "#d4d7d9"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#1d2328"
background-alpha = 0.90
text             = "#eaebeb"
border           = "#7bb7e0"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#1d2328"
background-alpha = 0.90
text             = "#d4d7d9"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#7bb7e0"

[launcher]
background                = "#151a1e"
background-alpha          = 0.92
text                      = "#eaebeb"
border                    = "#7bb7e0"
border-alpha              = 1.0
scrim                     = "#151a1e"
scrim-alpha               = 0.55
selected-background       = "#324858"
selected-background-alpha = 0.30
selected-text             = "#c1eaeb"
selected-border           = "#7bb7e0"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#151a1e"
background-alpha          = 0.92
text                      = "#eaebeb"
border                    = "#7bb7e0"
border-alpha              = 1.0
scrim                     = "#151a1e"
scrim-alpha               = 0.55
selected-background       = "#324858"
selected-background-alpha = 0.30
selected-text             = "#c1eaeb"
selected-border           = "#7bb7e0"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#151a1e"
background-alpha = 0.92
text             = "#d4d7d9"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
scrim            = "#151a1e"
scrim-alpha      = 0.5
accent           = "#7bb7e0"

[lock]
background       = "#151a1e"
background-alpha = 0.78
text             = "#d4d7d9"
placeholder      = "#697b87"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
selection        = "#7bb7e0"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#151a1e"
scrim-alpha             = "0.5"
text                    = "#d4d7d9"
selected-border         = "#7bb7e0"
selected-border-alpha   = 1.0
unselected-border       = "#b2b9bd"
unselected-border-alpha = 0.28
