# ============================================================================
#  Linuxing Max — Kernel Green · the Linux console signature
#  generated by tools/linuxing_generate.py
#  surface #141f19 · accent #3ddc84 · primary #22d3ee · secondary #a3e635
#
#  The scheme-tinted glass surfaces for the Omarchy shell: bar, menu,
#  launcher, lock, notifications, tooltips, popups, polkit and the image
#  picker. Slightly more translucent than stock — the "reduced opacity" half
#  of the Linuxing look.
# ============================================================================

[bar]
background       = "#141f19"
background-alpha = 0.84
text             = "#d3d9d6"
active           = "#3ddc84"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(3ddc84ee) rgba(22d3eeee) rgba(a3e635ee) 45deg"
active-border-foreground = "#3ddc84"

[controls]
normal-color        = "#b1beb7"
normal-fill-alpha   = 0.05
normal-border       = "#b1beb7"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#eaecea"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#3ddc84"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#3ddc84"
focus-fill-alpha   = 0.12
focus-border       = "#3ddc84"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#22d3ee"
selected-fill-alpha   = 0.18
selected-border       = "#22d3ee"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#1c2822"
background-alpha = 0.90
text             = "#d3d9d6"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#1c2822"
background-alpha = 0.90
text             = "#eaecea"
border           = "#3ddc84"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#1c2822"
background-alpha = 0.90
text             = "#d3d9d6"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#3ddc84"

[launcher]
background                = "#141f19"
background-alpha          = 0.92
text                      = "#eaecea"
border                    = "#3ddc84"
border-alpha              = 1.0
scrim                     = "#141f19"
scrim-alpha               = 0.55
selected-background       = "#2f5a43"
selected-background-alpha = 0.30
selected-text             = "#ddf1bb"
selected-border           = "#3ddc84"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#141f19"
background-alpha          = 0.92
text                      = "#eaecea"
border                    = "#3ddc84"
border-alpha              = 1.0
scrim                     = "#141f19"
scrim-alpha               = 0.55
selected-background       = "#2f5a43"
selected-background-alpha = 0.30
selected-text             = "#ddf1bb"
selected-border           = "#3ddc84"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#141f19"
background-alpha = 0.92
text             = "#d3d9d6"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
scrim            = "#141f19"
scrim-alpha      = 0.5
accent           = "#3ddc84"

[lock]
background       = "#141f19"
background-alpha = 0.78
text             = "#d3d9d6"
placeholder      = "#678876"
text-error       = "#d17374"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#d17374"
border-alpha     = 1.0
border-width     = 2
selection        = "#3ddc84"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#141f19"
scrim-alpha             = "0.5"
text                    = "#d3d9d6"
selected-border         = "#3ddc84"
selected-border-alpha   = 1.0
unselected-border       = "#b1beb7"
unselected-border-alpha = 0.28
