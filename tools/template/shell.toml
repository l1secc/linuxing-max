# ============================================================================
#  Linuxing Max — @title@ · @blurb@
#  generated by tools/linuxing_generate.py
#  surface @surface@ · accent @accent@ · primary @primary@ · secondary @secondary@
#
#  The scheme-tinted glass surfaces for the Omarchy shell: bar, menu,
#  launcher, lock, notifications, tooltips, popups, polkit and the image
#  picker. Slightly more translucent than stock — the "reduced opacity" half
#  of the Linuxing look.
# ============================================================================

[bar]
background       = "@surface@"
background-alpha = 0.84
text             = "@surface_fg@"
active           = "@accent@"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "@border_active@"
active-border-foreground = "@accent@"

[controls]
normal-color        = "@light_fg@"
normal-fill-alpha   = 0.05
normal-border       = "@light_fg@"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "@surface_bright_fg@"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "@accent@"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "@accent@"
focus-fill-alpha   = 0.12
focus-border       = "@accent@"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "@primary@"
selected-fill-alpha   = 0.18
selected-border       = "@primary@"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "@dark@"
background-alpha = 0.90
text             = "@surface_fg@"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "@dark@"
background-alpha = 0.90
text             = "@surface_bright_fg@"
border           = "@accent@"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "@dark@"
background-alpha = 0.90
text             = "@surface_fg@"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "@accent@"

[launcher]
background                = "@surface@"
background-alpha          = 0.92
text                      = "@surface_bright_fg@"
border                    = "@accent@"
border-alpha              = 1.0
scrim                     = "@surface@"
scrim-alpha               = 0.55
selected-background       = "@selection@"
selected-background-alpha = 0.30
selected-text             = "@secondary_bright@"
selected-border           = "@accent@"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "@surface@"
background-alpha          = 0.92
text                      = "@surface_bright_fg@"
border                    = "@accent@"
border-alpha              = 1.0
scrim                     = "@surface@"
scrim-alpha               = 0.55
selected-background       = "@selection@"
selected-background-alpha = 0.30
selected-text             = "@secondary_bright@"
selected-border           = "@accent@"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "@surface@"
background-alpha = 0.92
text             = "@surface_fg@"
text-error       = "@surface_red@"
border           = "hyprland.active-border"
border-error     = "@surface_red@"
border-alpha     = 1.0
border-width     = 2
scrim            = "@surface@"
scrim-alpha      = 0.5
accent           = "@accent@"

[lock]
background       = "@surface@"
background-alpha = 0.78
text             = "@surface_fg@"
placeholder      = "@dark_fg@"
text-error       = "@surface_red@"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "@surface_red@"
border-alpha     = 1.0
border-width     = 2
selection        = "@accent@"
selection-alpha  = 0.45

[image-picker]
scrim                   = "@surface@"
scrim-alpha             = "0.5"
text                    = "@surface_fg@"
selected-border         = "@accent@"
selected-border-alpha   = 1.0
unselected-border       = "@light_fg@"
unselected-border-alpha = 0.28
